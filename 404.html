<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/src/shared/js/baseurl.js"></script>


    <meta name="google-adsense-account" content="ca-pub-8030717046519441">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Error 404</title>
    <link rel="icon" href="/src/images/icons/icon.ico">


    <link rel="stylesheet" href="/src/shared/css/root.css">
    <link rel="stylesheet" href="/src/shared/css/mainpagestyle.css">
</head>
<body>
    <script src="/src/shared/js/load_ui.js" type="module"></script>
    <div id="nav-bar"></div>

    <script type="module">
        import {loadUI} from './src/shared/js/load_ui.js';
        loadUI(false);
    </script>
    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h1>Uh oh, looks like this page doesn't exist yet</h1>
        <img src="/src/images/icons/icon.png" style="width: 20rem">
        <div style="margin: 5rem;">
            <span>Redirecting you back in <span id="countdown"></span>...</span>
        </div>
        <h2><a href="/" style="color: var(--primary-link-colour); text-decoration: none">Return to homepage</a></h2>
    </div>
    
    
    <script>
        const seconds = 5;
        var counted = 0
        const countdown = document.getElementById("countdown")
        setInterval(() => {
            countdown.innerText = `${seconds-counted}`
            counted += 1
            if (counted > seconds) {
                window.location.href = "/"
            }
        }, 1000
        )
    </script>
</body>
</html>
