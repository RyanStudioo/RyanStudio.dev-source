<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/src/shared/js/baseurl.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">Search -  RyanStudio.dev</title>

    <link rel="icon" href="/src/images/icons/icon.ico">


    <link rel="stylesheet" href="/src/shared/css/root.css">
    <link rel="stylesheet" href="/src/shared/css/mainpagestyle.css">
    <link rel="stylesheet" href="/src/pages/css/search.css">
</head>
<body>
    <script src="/src/shared/js/load_ui.js" type="module"></script>
    <script src="/src/shared/js/searchbar.js" type="module"></script>
    <div id="nav-bar"></div>

    <main id="main">

    </main>

    <script type="module">
        import {loadUI} from './src/shared/js/load_ui.js';
        import {initSearch, formatSearch, searchPage, addListeners, storeSearchHistoryEntry} from "/src/shared/js/searchbar.js"
        loadUI(false);
        const itemsArray = await initSearch()
        const queryString = window.location.search;
        const params = new URLSearchParams(queryString)
        const main = document.getElementById("main")

        if (params.has("q")) {
            main.classList.add("list-results");
            const query = params.get("q");
            var results;
            if (query) {
                const title = document.title = `${query} - RyanStudio.dev`
                results = await searchPage(query, 0.2);
                const h1Element = document.createElement("h1");
                h1Element.classList.add("results-title")
                h1Element.textContent = `Showing ${results.resultsAmount} of ${results.results.length} Results...`;
                main.appendChild(h1Element);
            } else {
                results = {"results": itemsArray, "resultsAmount": 0};
            }
            console.log(results)
            const formattedResults = results["results"].map(result => formatSearch(result)).join('');
            main.innerHTML = main.innerHTML + formattedResults;
            const searchBarResults = document.getElementById("main");
            var placement = 0;
            for (const child of searchBarResults.children) {
                child.addEventListener("click", ()=> {
                    const id = child.id;
                    storeSearchHistoryEntry(id);
                }, {once: true})
                if (placement-1 === results.resultsAmount) {
                    const otherResults = document.createElement("h1");
                    const splitter = document.createElement("hr")
                    splitter.classList.add("splitter")
                    otherResults.textContent = "Other Results...";
                    otherResults.classList.add("results-title")
                    child.before(otherResults);
                    otherResults.before(splitter)
                }
                placement += 1
            }
        } else {
            const h1Element = document.createElement("h1")
            const inputContainer = document.createElement("div")
            const searchIcon = document.createElement("span")
            const inputElement = document.createElement("input")
            h1Element.textContent = "RyanStudio.dev"
            h1Element.classList.add("search-title")
            main.appendChild(h1Element)
            main.appendChild(inputElement)
            main.classList.add("fill-container")
            inputContainer.appendChild(searchIcon)
            inputContainer.appendChild(inputElement)
            inputElement.type = "text"
            inputElement.classList.add("main-search-bar")
            inputContainer.classList.add("search-container")
            searchIcon.classList.add("search-icon-search")
            inputElement.placeholder = "Search RyanStudio.dev"
            main.appendChild(inputContainer)

            function locationResult() {
                const inputValue = inputElement.value.trim()
                window.location.href = `${window.location.href}?q=${inputValue}`
            }

            searchIcon.addEventListener("click", () => {
                locationResult()
            })
            inputContainer.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    locationResult()
                    event.preventDefault()
                }
            })
        }
    </script>
    
</body>
</html>
